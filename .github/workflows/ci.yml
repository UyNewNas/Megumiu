name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to test for a release
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  test-and-build:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Install package and build tools
        run: python -m pip install -e ".[camera]" build
      - name: Compile Python sources
        run: python -m compileall -q src tests packaging
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        env:
          SMOKE_OUTPUT: ${{ runner.temp }}/megumiu-smoke
        shell: python
        run: |
          import os
          import subprocess
          import sys
          subprocess.run([sys.executable, "-m", "megumiu", "--help"], check=True)
          subprocess.run([
              sys.executable, "-m", "megumiu", "simulate", "--duration", "2",
              "--fps", "60", "--output", os.environ["SMOKE_OUTPUT"],
          ], check=True)
      - name: Build wheel and source distribution
        run: python -m build
      - name: Save Python distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Package and smoke test Windows executable
        if: matrix.os == 'windows-latest' && matrix.python == '3.13'
        shell: pwsh
        run: ./scripts/package_windows.ps1
      - name: Save Windows portable archive
        if: matrix.os == 'windows-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-portable
          path: dist/windows/*.zip
          if-no-files-found: error
          retention-days: 14
