name: Draft release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (must equal v + pyproject.toml version)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Validate existing tag and package version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: python
        run: |
          import os
          import pathlib
          import re
          import subprocess
          import tomllib
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v[0-9][0-9A-Za-z.+-]*", tag):
              raise SystemExit("Expected a version tag beginning with v and a digit")
          commit = subprocess.check_output([
              "git", "rev-parse", "--verify", f"refs/tags/{tag}^{{commit}}",
          ], text=True).strip()
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if commit != head:
              raise SystemExit("Checked-out commit does not match the requested tag")
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text("utf-8"))["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} must exactly equal v{version}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={tag}\ncommit={commit}\n")

  verify-and-build:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.commit }}
    permissions:
      contents: read

  draft:
    needs: [validate, verify-and-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: python-distributions
          path: release-assets
      - uses: actions/download-artifact@v8.0.1
        with:
          name: windows-portable
          path: release-assets
      - name: Verify assets and generate checksums
        shell: python
        run: |
          import hashlib
          import pathlib
          directory = pathlib.Path("release-assets")
          for pattern in ("*.whl", "*.tar.gz", "*.zip"):
              if len(list(directory.glob(pattern))) != 1:
                  raise SystemExit(f"Expected exactly one {pattern} asset")
          assets = sorted(directory.iterdir())
          if len(assets) != 3 or not all(path.is_file() for path in assets):
              raise SystemExit("Unexpected files in the release assets")
          lines = []
          for path in assets:
              with path.open("rb") as source:
                  digest = hashlib.file_digest(source, "sha256").hexdigest()
              lines.append(f"{digest}  {path.name}\n")
          (directory / "SHA256SUMS.txt").write_text("".join(lines), encoding="utf-8")
          pathlib.Path("release-notes.md").write_text(
              "Megumiu phase 1 development preview.\n\n"
              "Includes the CLI, simulation and camera capture diagnostics. "
              "This is not a complete body tracker or SteamVR driver.\n\n"
              "Extract the entire Windows ZIP before running megumiu.exe. "
              "Keep the _internal directory beside it. Check SHA256SUMS.txt "
              "before distributing these assets.\n\n"
              "This release remains a draft prerelease until a maintainer reviews "
              "the checks and explicitly publishes it.\n",
              encoding="utf-8",
          )
      - name: Create or refresh draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft,isPrerelease > release-state.json 2>/dev/null; then
            python -c 'import json; s=json.load(open("release-state.json")); assert s["isDraft"] and s["isPrerelease"], "Refusing to change a published release or a non-prerelease"'
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --draft --prerelease --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag --draft --prerelease \
              --title "Megumiu $RELEASE_TAG" --notes-file release-notes.md
          fi
